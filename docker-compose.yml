services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENV: production
      DEBUG: "0"
      SEED_DEMO_DATA: "0"
      SESSION_SECURE_COOKIES: "1"
      TRUSTED_HOSTS: localhost,127.0.0.1,web
      SESSION_SECRET: ${SESSION_SECRET}
    volumes:
      - recsys_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  recsys_data:
